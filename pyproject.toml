[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "webhook-reflector"
version = "0.1.0"
description = "CLI webhook receptor, HMAC signature verifier, and replay engine"
authors = [{ name = "Geno Joshua" }]
requires-python = ">=3.9"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
